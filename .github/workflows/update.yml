name: Update jobs

on:
  schedule:
    - cron: "30 4 * * *"   # every day 04:30 UTC (06:30 in Hamburg summer time)
  workflow_dispatch:
    inputs:
      max_ai:
        description: "Max postings the AI step may describe in this run"
        default: "400"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and describe jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python pipeline/build.py --max-ai "${{ github.event.inputs.max_ai || '400' }}"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push
