<!doctype html><html><head><meta charset="utf-8"><style>
.hero-art { width: 100%; height: auto; display: block; margin-bottom: 16px; }
.hero-art .line { fill: none; stroke: var(--art-line); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.hero-art .thin { stroke-width: 1.2; opacity: .6; }
.hero-art .glass { fill: var(--art-glass); }
.hero-art .brick { fill: var(--art-brick); stroke: var(--art-line); stroke-width: 2.2; }
.hero-art .box { stroke: var(--art-line); stroke-width: 1.6; }
.hero-art .c1 { fill: var(--box1); } .hero-art .c2 { fill: var(--box2); } .hero-art .c3 { fill: var(--box3); }
.hero-art .sun { fill: var(--art-sun); }
.hero-art .cloud { fill: none; stroke: var(--art-line); stroke-width: 2; stroke-linecap: round; opacity: .35; }
.hero-art .water { fill: none; stroke: var(--art-water); stroke-width: 2.2; stroke-linecap: round; }
.hero-art .water.thin { opacity: .5; }
:root{--art-line:#334155;--art-glass:#dbeafe;--art-brick:#e7c3b0;--art-sun:#fde68a;--art-water:#0f766e;--box1:#0f766e;--box2:#f59e0b;--box3:#e11d48;}
body{margin:0;width:1200px;height:630px;font-family:"Segoe UI",system-ui,sans-serif;background:#ffffff;color:#111827;overflow:hidden}
.wrap{position:relative;height:630px;box-sizing:border-box;padding:64px 72px;display:grid;grid-template-columns:1fr 440px;gap:24px;align-items:center}
.bar{position:absolute;left:0;top:0;width:100%;height:14px;background:#0f766e}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:28px;margin-bottom:36px}
.mark{width:52px;height:52px;border-radius:13px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px}
h1{font-size:56px;line-height:1.08;letter-spacing:-.02em;margin:0 0 28px}
h1 span{color:#0f766e}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{font-size:22px;font-weight:600;padding:8px 16px;border-radius:10px}
.l0{background:#dcfce7;color:#166534} .l1{background:#fef3c7;color:#92400e} .l2{background:#ffe4e6;color:#9f1239}
.url{position:absolute;left:72px;bottom:40px;font-size:22px;color:#6b7280}

.hero-art{width:440px;height:auto}
